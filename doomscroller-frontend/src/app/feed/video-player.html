<video
  #video
  appAutoPlayInView
  class="video"
  [src]="src()"
  [muted]="prefs.muted()"
  playsinline
  loop
  preload="metadata"
  (click)="togglePlay()"
  (timeupdate)="onTimeUpdate()"
  (loadedmetadata)="onMetadata()"
  (durationchange)="onMetadata()"
  (play)="paused.set(false)"
  (pause)="paused.set(true)"
></video>

@if (paused()) {
  <!-- Purely decorative: the whole video is the tap target. -->
  <svg class="play-hint" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
}

<button
  type="button"
  class="mute"
  [attr.aria-label]="prefs.muted() ? 'Unmute' : 'Mute'"
  [attr.aria-pressed]="prefs.muted()"
  (click)="toggleMute()"
>
  @if (prefs.muted()) {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 9v6h4l5 5V4L7 9H3z" />
      <path d="m16.5 9.5 5 5m0-5-5 5" stroke-width="2" stroke-linecap="round" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 9v6h4l5 5V4L7 9H3z" />
      <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round" />
    </svg>
  }
</button>

<div
  class="seek"
  [class.scrubbing]="scrubbing()"
  role="slider"
  tabindex="0"
  aria-label="Seek"
  aria-valuemin="0"
  [attr.aria-valuemax]="duration() > 0 ? duration() : 0"
  [attr.aria-valuenow]="currentTime()"
  [attr.aria-valuetext]="valueText()"
  (pointerdown)="onSeekPointerDown($event)"
  (pointermove)="onSeekPointerMove($event)"
  (pointerup)="onSeekPointerEnd($event)"
  (pointercancel)="onSeekPointerEnd($event)"
  (keydown)="onSeekKeyDown($event)"
>
  <div class="seek-track">
    <div class="seek-fill" [style.width.%]="percent()"></div>
  </div>
</div>
