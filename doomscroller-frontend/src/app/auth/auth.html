<div class="auth-page">
  <h1>{{ isRegister() ? 'Create an account' : 'Log in' }}</h1>

  @if (errorMessage(); as message) {
    <div class="status error">{{ message }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Username
      <input type="text" formControlName="username" autocomplete="username" autocapitalize="none" maxlength="30" />
      @if (isRegister()) {
        <small>3-30 characters: letters, digits and underscores.</small>
      }
    </label>

    <label>
      Password
      <input
        type="password"
        formControlName="password"
        [attr.autocomplete]="isRegister() ? 'new-password' : 'current-password'"
        maxlength="128"
      />
      @if (isRegister()) {
        <small>At least 8 characters.</small>
      }
    </label>

    <button type="submit" [disabled]="form.invalid || busy()">
      {{ busy() ? 'Please wait…' : isRegister() ? 'Sign up' : 'Log in' }}
    </button>
  </form>

  <p class="switch">
    @if (isRegister()) {
      Already have an account? <a routerLink="/login" [queryParams]="{ returnUrl: returnUrl() }">Log in</a>
    } @else {
      New here? <a routerLink="/register" [queryParams]="{ returnUrl: returnUrl() }">Create an account</a>
    }
  </p>
</div>
