<div class="upload-page">
  <a routerLink="/" class="back-link">&larr; Feed</a>
  <h1>Upload a video</h1>

  <div class="status error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="success" *ngIf="uploadedVideoId">
    <p>Uploaded! Transcoding in the background.</p>
    <button type="button" (click)="goToFeed()">Go to feed</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="formOptions && !uploadedVideoId">
    <label class="file-drop">
      <input type="file" accept="video/*" (change)="onFileSelected($event)" />
      <span *ngIf="!selectedFile">Choose a video file&hellip;</span>
      <span *ngIf="selectedFile">{{ selectedFile.name }}</span>
    </label>

    <label>
      Title
      <input type="text" formControlName="title" placeholder="A short caption" />
    </label>

    <fieldset>
      <legend>Encoding preset</legend>
      <label class="radio" *ngFor="let preset of formOptions.presets">
        <input type="radio" formControlName="preset" [value]="preset.value" />
        {{ preset.label }}
      </label>
    </fieldset>

    <fieldset>
      <legend>Container</legend>
      <label class="radio" *ngFor="let container of formOptions.containers">
        <input type="radio" formControlName="container" [value]="container.value" />
        {{ container.label }}
      </label>
    </fieldset>

    <fieldset>
      <legend>Audio</legend>
      <label class="checkbox">
        <input type="checkbox" formControlName="forceCopyAudioIfSupported" />
        Copy source audio when possible (aac / mp3 / opus - wma is always re-encoded)
      </label>
    </fieldset>

    <fieldset>
      <legend>Resolutions to generate</legend>
      <label class="radio" *ngFor="let res of formOptions.resolutionPresets">
        <input
          type="radio"
          name="resolutionMode"
          [checked]="!customResolutions && form.value.resolutionTargets === res.value"
          (change)="customResolutions = false; form.patchValue({ resolutionTargets: res.value })"
        />
        {{ res.label }}
      </label>
      <label class="radio">
        <input
          type="radio"
          name="resolutionMode"
          [checked]="customResolutions"
          (change)="customResolutions = true; form.patchValue({ resolutionTargets: '' })"
        />
        Custom
      </label>
      <input
        *ngIf="customResolutions"
        type="text"
        formControlName="resolutionTargets"
        placeholder="e.g. 360,720,1080"
        class="custom-res-input"
      />
      <p class="hint">Anything taller than the source video's own resolution is skipped automatically.</p>
    </fieldset>

    <button type="submit" [disabled]="!selectedFile || uploading || form.invalid">
      {{ uploading ? 'Uploading… ' + progressPercent + '%' : 'Upload & convert' }}
    </button>

    <div class="progress-bar" *ngIf="uploading">
      <div class="progress-fill" [style.width.%]="progressPercent"></div>
    </div>
  </form>
</div>
