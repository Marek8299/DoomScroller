<div class="upload-page">
  <a routerLink="/" class="back-link">&larr; Feed</a>
  <h1>Upload a video</h1>

  @if (errorMessage(); as message) {
    <div class="status error">{{ message }}</div>
  }

  @if (uploadedVideoId()) {
    <div class="success">
      <p>Uploaded! It will show up in the feed once processing finishes.</p>
      <button type="button" (click)="goToFeed()">Go to feed</button>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="file-drop">
        <input type="file" accept="video/*" (change)="onFileSelected($event)" />
        <span>{{ selectedFile()?.name ?? 'Choose a video file…' }}</span>
      </label>

      <label>
        Name
        <input type="text" formControlName="title" maxlength="200" placeholder="A short name" />
      </label>

      <label>
        Description <span class="optional">(optional)</span>
        <textarea formControlName="description" rows="4" maxlength="2000" placeholder="Say something about it"></textarea>
      </label>

      <button type="submit" [disabled]="!selectedFile() || uploading() || form.invalid">
        {{ uploading() ? 'Uploading… ' + progressPercent() + '%' : 'Upload' }}
      </button>

      @if (uploading()) {
        <div class="progress-bar">
          <div class="progress-fill" [style.width.%]="progressPercent()"></div>
        </div>
      }
    </form>
  }
</div>
